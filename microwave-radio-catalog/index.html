<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microwave Radio Sub-Band Catalog</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #d8dce2;
    --text: #1c232b;
    --muted: #8a94a3;
    --accent: #1f5fbf;
    --accent-weak: #e8f0fd;
    --head-bg: #eef1f5;
    --code-bg: #f1f3f6;
    --verified-bg: #dff3e3; --verified-fg: #16713a;
    --inferred-bg: #fdf1d6; --inferred-fg: #8a6100;
    --unconfirmed-bg: #fbe1e1; --unconfirmed-fg: #a4282c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --panel: #1c2129;
      --border: #333a45;
      --text: #e6e9ee;
      --muted: #8790a0;
      --accent: #6ba3ff;
      --accent-weak: #1e2c42;
      --head-bg: #232a34;
      --code-bg: #232a34;
      --verified-bg: #14301f; --verified-fg: #6fd995;
      --inferred-bg: #3a2f0d; --inferred-fg: #e8c766;
      --unconfirmed-bg: #3a1717; --unconfirmed-fg: #f18b8e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  a { color: var(--accent); }
  header.top {
    position: sticky; top: 0; z-index: 20;
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  header.top h1 { font-size: 15px; margin: 0 12px 0 0; white-space: nowrap; }
  #search {
    flex: 1 1 220px; min-width: 160px; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px;
  }
  .btn {
    padding: 7px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer;
  }
  .btn:hover { background: var(--head-bg); }
  nav.tabs {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  nav.tabs.families { padding-top: 4px; }
  .tab-btn {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--bg); color: var(--text); font-size: 13px; cursor: pointer;
  }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .family-group { display: flex; align-items: center; gap: 6px; margin-right: 10px; }
  .family-group-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin-right: 2px;
  }
  main { padding: 16px; max-width: 1200px; margin: 0 auto; }
  .family-header { margin-bottom: 14px; }
  .family-header h2 { margin: 0 0 4px 0; font-size: 19px; }
  .family-meta { color: var(--muted); font-size: 12.5px; }
  .family-desc { margin: 6px 0 0 0; font-size: 13px; color: var(--text); }
  details.band {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 10px; overflow: hidden;
  }
  details.band > summary {
    list-style: none; cursor: pointer; padding: 10px 14px; background: var(--head-bg);
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px;
  }
  details.band > summary::-webkit-details-marker { display: none; }
  details.band > summary::before { content: "▸ "; color: var(--muted); }
  details.band[open] > summary::before { content: "▾ "; }
  .band-name { font-weight: 700; font-size: 14px; }
  .band-meta { color: var(--muted); font-size: 12px; }
  .band-note { padding: 8px 14px 0 14px; color: var(--muted); font-size: 12px; font-style: italic; }
  .empty-note { padding: 12px 14px; color: var(--muted); font-size: 13px; }
  .table-scroll { overflow-x: auto; padding: 10px 14px 14px 14px; }
  table { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 12.5px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  td.notes-cell, th.notes-cell { white-space: normal; min-width: 220px; }
  th { background: var(--code-bg); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); position: sticky; top: 0; }
  tr:hover td { background: var(--accent-weak); }
  .muted { color: var(--muted); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
  }
  .badge-verified { background: var(--verified-bg); color: var(--verified-fg); }
  .badge-inferred { background: var(--inferred-bg); color: var(--inferred-fg); }
  .badge-unconfirmed { background: var(--unconfirmed-bg); color: var(--unconfirmed-fg); }
  .src-link { text-decoration: none; font-size: 14px; }
  .search-banner {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px; font-size: 13px; color: var(--muted);
  }
  .search-banner strong { color: var(--text); }
  .freqmap { padding: 10px 14px 4px 14px; border-top: 1px solid var(--border); }
  .freqmap-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
  .freqmap-title { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 600; }
  .freqmap-plans { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-left: auto; }
  .freqmap-plans-label { font-size: 11px; color: var(--muted); margin-right: 2px; }
  .chip {
    padding: 2px 9px; border: 1px solid var(--border); border-radius: 999px;
    background: var(--bg); color: var(--text); font-size: 11px; cursor: pointer;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .freqmap-svg { width: 100%; height: auto; display: block; }
  .freqmap-legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 4px 0 8px 0; font-size: 10.5px; color: var(--muted); }
  .freqmap-legend span.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .chan-tick-flag { stroke: var(--unconfirmed-fg) !important; stroke-width: 2 !important; }
  .chan-section { padding: 14px; border-top: 1px solid var(--border); }
  .chan-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip-lg {
    padding: 9px 20px; border: 2px solid var(--border); border-radius: 10px;
    background: var(--panel); color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .chip-lg.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chan-unit-note { margin: 0 0 14px 0; color: var(--muted); font-size: 12.5px; }
  .chan-grid { padding: 8px 0 4px 0; }
  .chan-spectrum-svg { width: 100%; height: auto; display: block; font-variant-numeric: tabular-nums; }
  footer.foot { padding: 20px 16px 40px; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<header class="top">
  <h1>Microwave Radio Sub-Band Catalog</h1>
  <input id="search" type="text" placeholder="Search part number or frequency (MHz)…" autocomplete="off">
  <button class="btn" id="exportCsvBtn">Export view → CSV</button>
  <button class="btn" id="exportJsonBtn">Export catalog → JSON</button>
</header>

<nav class="tabs" id="mfgTabs"></nav>
<nav class="tabs families" id="familyTabs"></nav>

<main id="main"></main>

<footer class="foot">
  Data entered by hand from vendor stores, distributor listings, and datasheets. A blank cell means the value is
  genuinely unpublished or unconfirmed — never a filled-in guess.
</footer>

<script>
/* ============================================================================
   DATA MODEL — read this before adding rows
   ============================================================================
   CATALOG.manufacturers is an array of:
     { id, name, families: [ ...family ] }

   A family is one radio family/model line:
     {
       id, group,              // `group` clusters sub-tabs visually only
                                // (e.g. "WTM 4000", "Eclipse") — it adds no
                                // extra navigation level.
       name,                   // shown as the sub-tab label
       description,            // optional free text shown above the bands
       last_verified,          // "YYYY-MM-DD" or null if not recorded —
                                // never guess a date.
       bands: [ ...band ]
     }

   A band is one frequency band's worth of rows for that family:
     {
       band,          // display label, e.g. "11 GHz" — any string works,
                       // the renderer does not special-case band names.
       model,         // "fixed_subband" | "tuning_range" | "full_band_tunable"
                       // | null if not yet determined for this band.
       tr_spacings,   // [MHz, ...] T/R spacings this band supports; [] if
                       // not published.
       rows: [ ...record ]     // [] is a valid, expected "scaffolded, no
                                // data yet" state.
     }

   Three record shapes, selected by the band's `model`:

   1) fixed_subband — the radio ships locked to a numbered sub-band with a
      fixed Tx window. One row per sub-band PER hi/lo half.
        {
          type: "fixed_subband",
          subband,             // vendor's own label, as a string: "01","B1","Ch1W6"
          side,                // "low" | "high" | null (some vendors publish
                                // Tx/Rx directly per sub-band with no
                                // low/high terminology at all — see SIAE rows)
          tx_min, tx_max,      // MHz, or null if genuinely unpublished
          rx_min, rx_max,      // MHz, or null — the paired half, when published
          tr_spacings,         // [MHz, ...] — usually mirrors the band's list
          part_number,
          pair_part_number,    // the other half's PN, when the datasheet pairs them
          source_url,          // null if no citable link was found
          source_type,         // "vendor" | "distributor" | "fcc_filing" | null
          confidence,          // "verified" | "inferred" | "unconfirmed"
          notes
        }

   2) tuning_range — the datasheet gives only full band edges plus a maximum
      tuning window; the actual sub-band is set by the filter/branching
      configuration at order time, not by the radio itself. No sub-band
      number exists for these rows.
        {
          type: "tuning_range",
          band_min, band_max,  // MHz, band edges — null if not restated for
                                // this specific variant
          max_tuning_range,    // MHz
          tr_spacings,
          source_url, source_type, confidence, notes
        }

   3) full_band_tunable — STUB ONLY, no data catalogued yet. For ODUs (e.g.
      NEC "sub-band free" units) that tune anywhere in the band with no
      filter change, so there is neither a sub-band number nor an ordered
      tuning window. Shape, once populated:
        {
          type: "full_band_tunable",
          band_min, band_max,
          tr_spacings,
          source_url, source_type, confidence, notes
        }
      The renderer (MODEL_INFO / renderBandTable below) already has a column
      set and explanatory note wired up for this type — do not assume every
      row has tx_min/tx_max when touching that code.

   4) channel_plan_display — no vendor data at all. Renders the FCC 101.147
      channel plan itself (from CHANNEL_PLANS below), organized by paired
      channel (low ↔ high), for a chosen subset of published channel
      bandwidths. This is what the "Generic" platform family uses instead
      of real sub-band rows. `rows` stays [] — there is nothing vendor-
      specific to catalogue — and the fields live on the band object itself:
        {
          band, model: "channel_plan_display",
          plan_key,     // CHANNEL_PLANS key, e.g. "10700-11700"
          bandwidths,   // channel_bandwidth strings to offer, in the order
                        // the selector should list them, e.g. ["10 MHz", "30 MHz"]
          tr_spacings: [], rows: []
        }

   Rule for every field above: if a value is unknown, write `null`. Never
   interpolate, round, or infer a number that wasn't explicitly published.
   A blank cell is recoverable; a wrong number silently isn't.
   ========================================================================== */

function channelPlanBandRange(key) {
  const [lo, hi] = key.split("-").map(Number);
  return [lo, hi];
}

// Returns every CHANNEL_PLANS entry whose CFR band segment overlaps [lo, hi].
function findChannelPlanBands(lo, hi) {
  return Object.keys(CHANNEL_PLANS)
    .filter(key => { const [pLo, pHi] = channelPlanBandRange(key); return pLo < hi && pHi > lo; })
    .map(key => ({ key, ...CHANNEL_PLANS[key] }));
}

const MODEL_INFO = {
  fixed_subband: {
    label: "Fixed sub-band",
    note: "Fixed sub-band radio — one row per numbered sub-band/side with a locked Tx window."
  },
  tuning_range: {
    label: "Tuning range",
    note: "Tuning-range radio — datasheet gives only band edges and a max tuning window; the sub-band is set by filter/branching selection at order time, not by the radio."
  },
  full_band_tunable: {
    label: "Full-band tunable",
    note: "Full-band tunable ODU — tunes anywhere within the band edges, no filter change required. (stub — no data catalogued yet)"
  },
  channel_plan_display: {
    label: "Channel plan",
    note: "No vendor sub-band data — this is the FCC 101.147 channel plan itself, organized by paired channel."
  }
};
const UNKNOWN_MODEL_NOTE = "Record type not yet determined for this band.";

const CONFIDENCE_LABEL = { verified: "Verified", inferred: "Inferred", unconfirmed: "Unconfirmed" };

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtVal(v) {
  return (v === null || v === undefined || v === "") ? '<span class="muted">—</span>' : escapeHtml(v);
}

function fmtSpacings(arr) {
  return (!arr || arr.length === 0) ? '<span class="muted">—</span>' : escapeHtml(arr.join(" / ") + " MHz");
}

function fmtSpacingsPlain(arr) {
  return (!arr || arr.length === 0) ? "not recorded" : arr.join(" / ") + " MHz";
}

function confBadge(conf) {
  if (!conf) return '<span class="muted">—</span>';
  const label = CONFIDENCE_LABEL[conf] || conf;
  return `<span class="badge badge-${escapeHtml(conf)}">${escapeHtml(label)}</span>`;
}

function sourceIcon(url, type) {
  if (!url) return '<span class="muted">—</span>';
  const safeUrl = escapeHtml(url);
  const title = escapeHtml(type || "source");
  return `<a class="src-link" href="${safeUrl}" target="_blank" rel="noopener noreferrer" title="${title}">&#128279;</a>`;
}

function renderFixedRow(r) {
  return `<tr>
    <td>${fmtVal(r.subband)}</td>
    <td>${fmtVal(r.side)}</td>
    <td>${fmtVal(r.tx_min)}</td>
    <td>${fmtVal(r.tx_max)}</td>
    <td>${fmtVal(r.rx_min)}</td>
    <td>${fmtVal(r.rx_max)}</td>
    <td>${fmtSpacings(r.tr_spacings)}</td>
    <td>${fmtVal(r.part_number)}</td>
    <td>${fmtVal(r.pair_part_number)}</td>
    <td>${sourceIcon(r.source_url, r.source_type)}</td>
    <td>${confBadge(r.confidence)}</td>
    <td class="notes-cell">${fmtVal(r.notes || null)}</td>
  </tr>`;
}

function renderTuningRow(r) {
  return `<tr>
    <td>${fmtVal(r.band_min)}</td>
    <td>${fmtVal(r.band_max)}</td>

    <td>${fmtSpacings(r.tr_spacings)}</td>
    <td>${sourceIcon(r.source_url, r.source_type)}</td>
    <td>${confBadge(r.confidence)}</td>
    <td class="notes-cell">${fmtVal(r.notes || null)}</td>
  </tr>`;
}

function renderFullBandRow(r) {
  return `<tr>
    <td>${fmtVal(r.band_min)}</td>
    <td>${fmtVal(r.band_max)}</td>
    <td>${fmtSpacings(r.tr_spacings)}</td>
    <td>${sourceIcon(r.source_url, r.source_type)}</td>
    <td>${confBadge(r.confidence)}</td>

  </tr>`;
}

/* ------------------------------------------------------------- FREQ MAP */

const CONF_COLOR_VAR = { verified: "--verified-fg", inferred: "--inferred-fg", unconfirmed: "--unconfirmed-fg" };

// Every tx/rx (or band_min/band_max) value a band's rows touch, for scaling the diagram.
function bandDiagramPoints(band) {
  const pts = [];
  (band.rows || []).forEach(r => {
    const vs = band.model === "fixed_subband" ? [r.tx_min, r.tx_max, r.rx_min, r.rx_max] : [r.band_min, r.band_max];
    vs.forEach(v => { if (v != null) pts.push(v); });
  });
  return pts;
}

// Renders a scaled SVG frequency map for one band: sub-band/tuning-window brackets,
// plus an optional FCC channel-plan tick overlay (findChannelPlanBands) toggled by
// a small bandwidth chip row. Returns "" when there's nothing to plot (e.g. every
// row's ranges are null, or model is unknown) — no diagram is better than a fake one.
function renderFreqMap(band, uid) {
  const rows = band.rows || [];
  const pts = bandDiagramPoints(band);
  if (pts.length === 0) return "";

  let lo = Math.min(...pts), hi = Math.max(...pts);
  const plansHere = findChannelPlanBands(lo, hi);
  const pad = Math.max((hi - lo) * 0.05, 4);
  lo -= pad; hi += pad;

  const W = 900, MARGIN = 10, LANE_H = band.model === "fixed_subband" ? 32 : 26;
  const x = f => MARGIN + (f - lo) / (hi - lo) * (W - 2 * MARGIN);

  let y = 26;
  const laneSvg = [];
  let anyNullRow = false;

  if (band.model === "fixed_subband") {
    rows.forEach(r => {
      if (r.tx_min == null && r.rx_min == null) { anyNullRow = true; return; }
      const colorVar = CONF_COLOR_VAR[r.confidence] || "--muted";
      const label = escapeHtml([r.subband != null ? `Sub-band ${r.subband}` : null, r.side].filter(Boolean).join(" · ") || "—");
      let seg = "";
      if (r.tx_min != null && r.tx_max != null) {
        const tt = escapeHtml(`Tx ${r.tx_min}–${r.tx_max} MHz${r.part_number ? " · " + r.part_number : ""}`);
        seg += `<rect x="${x(r.tx_min).toFixed(1)}" y="${y}" width="${Math.max(x(r.tx_max) - x(r.tx_min), 1.5).toFixed(1)}" height="9" rx="2" fill="var(${colorVar})" fill-opacity="0.4" stroke="var(${colorVar})" stroke-width="1"><title>${tt}</title></rect>`;
      }
      if (r.rx_min != null && r.rx_max != null) {
        const tt = escapeHtml(`Rx ${r.rx_min}–${r.rx_max} MHz${r.part_number ? " · " + r.part_number : ""}`);
        seg += `<rect x="${x(r.rx_min).toFixed(1)}" y="${y + 12}" width="${Math.max(x(r.rx_max) - x(r.rx_min), 1.5).toFixed(1)}" height="9" rx="2" fill="var(${colorVar})" fill-opacity="0.15" stroke="var(${colorVar})" stroke-width="1" stroke-dasharray="2,2"><title>${tt}</title></rect>`;
      }
      if (!seg) { anyNullRow = true; return; }
      laneSvg.push(`<text x="${MARGIN}" y="${y - 3}" font-size="9" fill="var(--muted)">${label}</text>${seg}`);
      y += LANE_H;
    });
  } else {
    rows.forEach(r => {
      if (r.band_min == null || r.band_max == null) { anyNullRow = true; return; }
      const bx = x(r.band_min), bw = Math.max(x(r.band_max) - x(r.band_min), 1.5);
      const tag = r.max_tuning_range
        ? `tunable window ${r.max_tuning_range} MHz — position set by ACU/filter selection at order time`
        : "tuning range";
      const tt = escapeHtml(`${r.band_min}–${r.band_max} MHz${r.notes ? " · " + r.notes : ""}`);
      laneSvg.push(`<text x="${bx.toFixed(1)}" y="${y - 3}" font-size="9" fill="var(--muted)">${escapeHtml(tag)}${r.notes ? " (" + escapeHtml(r.notes) + ")" : ""}</text>` +
        `<rect x="${bx.toFixed(1)}" y="${y}" width="${bw.toFixed(1)}" height="12" rx="3" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4,2"><title>${tt}</title></rect>`);
      y += LANE_H;
    });
  }

  if (laneSvg.length === 0) return "";

  // Optional FCC channel-plan tick overlay, one toggleable lane per available bandwidth.
  const bwGroups = {};
  plansHere.forEach(pb => pb.plans.forEach(p => {
    (bwGroups[p.channel_bandwidth] = bwGroups[p.channel_bandwidth] || []).push(...p.rows);
  }));
  const bwKeys = Object.keys(bwGroups).sort((a, b) => parseFloat(a) - parseFloat(b));

  let tickLaneY = y + 4;
  let ticksSvg = "";
  bwKeys.forEach((bw, idx) => {
    const inRange = bwGroups[bw].filter(r => r.tx_mhz >= lo && r.tx_mhz <= hi);
    const ticks = inRange.map(r => {
      const tx = x(r.tx_mhz).toFixed(1);
      const cls = r.note ? ' class="chan-tick-flag"' : "";
      const tt = escapeHtml(`${r.tx_mhz} MHz${r.rx_mhz != null ? " / " + r.rx_mhz + " MHz" : " (unpaired)"}${r.note ? " — " + r.note : ""}`);
      return `<line${cls} x1="${tx}" y1="${tickLaneY}" x2="${tx}" y2="${tickLaneY + 10}" stroke="var(--accent)" stroke-width="1.4"><title>${tt}</title></line>`;
    }).join("");
    ticksSvg += `<g class="chan-plan-lane" data-uid="${uid}" data-bw="${escapeHtml(bw)}" style="display:${idx === 0 ? "block" : "none"}">${ticks}</g>`;
  });
  const axisY = (bwKeys.length ? tickLaneY + 16 : y + 6);

  const svgHtml = `<svg class="freqmap-svg" data-uid="${escapeHtml(uid)}" viewBox="0 0 ${W} ${axisY + 14}">
    ${laneSvg.join("")}
    ${ticksSvg}
    <line x1="${MARGIN}" y1="${axisY}" x2="${W - MARGIN}" y2="${axisY}" stroke="var(--border)"/>
    <text x="${MARGIN}" y="${axisY + 11}" font-size="10" fill="var(--muted)">${lo.toFixed(0)} MHz</text>
    <text x="${W - MARGIN}" y="${axisY + 11}" font-size="10" fill="var(--muted)" text-anchor="end">${hi.toFixed(0)} MHz</text>
  </svg>`;

  const chips = bwKeys.length
    ? `<span class="freqmap-plans">
        <span class="freqmap-plans-label">FCC channel plan (§101.147):</span>
        <button class="chip" data-freqmap="${escapeHtml(uid)}" data-bw="">Off</button>
        ${bwKeys.map((bw, idx) => `<button class="chip${idx === 0 ? " active" : ""}" data-freqmap="${escapeHtml(uid)}" data-bw="${escapeHtml(bw)}">${escapeHtml(bw)}</button>`).join("")}
      </span>`
    : "";

  return `<div class="freqmap">
    <div class="freqmap-head"><span class="freqmap-title">Frequency map</span>${chips}</div>
    ${svgHtml}
    <div class="freqmap-legend">
      <span><span class="sw" style="background:var(--verified-fg)"></span>verified</span>
      <span><span class="sw" style="background:var(--inferred-fg)"></span>inferred</span>
      <span><span class="sw" style="background:var(--unconfirmed-fg)"></span>unconfirmed</span>
      ${band.model === "fixed_subband" ? '<span>solid = Tx, dashed = Rx</span>' : '<span>dashed box = tuning window, not a fixed position</span>'}
      ${bwKeys.length ? '<span>tick = FCC channel plan Tx (hover for pair / caveats)</span>' : ''}
      ${anyNullRow ? '<span>rows with unpublished ranges are omitted here, not placed by guess</span>' : ''}
    </div>
  </div>`;
}

/* ----------------------------------------------------------- CHANNEL SPECTRUM */

// One bandwidth's spectrum strip: a single axis spanning the *entire* CFR band
// (not just where channels happen to fall), with a bold vertical tick at every
// channel's low frequency and every channel's high frequency, to true scale.
// Channel-number labels are drawn when there's room for them; past a density
// threshold they're dropped in favor of a hover tooltip, so labels never
// overlap into noise. Low/high naturally separate into two clusters because
// that's how the band is actually organized — no extra encoding needed.
function renderChannelSpectrum(lo, hi, plan, uid, bw, active) {
  const W = 900, MARGIN = 18, TICK_H = 34, BASELINE = 56;
  const x = f => MARGIN + (f - lo) / (hi - lo) * (W - 2 * MARGIN);
  const rows = plan.rows;
  const showLabels = rows.length <= 26;
  const labelRowY = BASELINE + (showLabels ? 34 : 4);
  const edgeY = labelRowY + 14;

  const lowXs = [], highXs = [];
  let ticks = "";
  const tick = (freq, chanNum, side, note) => {
    const tx = x(freq);
    (side === "low" ? lowXs : highXs).push(tx);
    const flagged = !!note;
    const stroke = flagged ? "var(--unconfirmed-fg)" : "var(--accent)";
    const sw = flagged ? 2.6 : 1.7;
    const tt = escapeHtml(`Ch ${chanNum} ${side}: ${freq} MHz` + (note ? " — " + note : ""));
    ticks += `<line x1="${tx.toFixed(1)}" y1="${BASELINE}" x2="${tx.toFixed(1)}" y2="${BASELINE - TICK_H}" stroke="${stroke}" stroke-width="${sw}"><title>${tt}</title></line>`;
    if (showLabels) {
      ticks += `<text x="${tx.toFixed(1)}" y="${BASELINE + 5}" font-size="9" font-weight="700" fill="var(--muted)" text-anchor="start" transform="rotate(62 ${tx.toFixed(1)} ${BASELINE + 5})">${chanNum}</text>`;
    }
  };
  rows.forEach((r, i) => {
    if (r.tx_mhz != null) tick(r.tx_mhz, i + 1, "low", r.note);
    if (r.rx_mhz != null) tick(r.rx_mhz, i + 1, "high", r.note);
  });

  let clusterCaptions = "";
  if (lowXs.length) {
    const mid = (Math.min(...lowXs) + Math.max(...lowXs)) / 2;
    clusterCaptions += `<text x="${mid.toFixed(1)}" y="${BASELINE - TICK_H - 8}" font-size="11" font-weight="800" letter-spacing="1" fill="var(--muted)" text-anchor="middle">LOW</text>`;
  }
  if (highXs.length) {
    const mid = (Math.min(...highXs) + Math.max(...highXs)) / 2;
    clusterCaptions += `<text x="${mid.toFixed(1)}" y="${BASELINE - TICK_H - 8}" font-size="11" font-weight="800" letter-spacing="1" fill="var(--muted)" text-anchor="middle">HIGH</text>`;
  }

  const svgHtml = `<svg class="chan-spectrum-svg" viewBox="0 0 ${W} ${edgeY + 8}">
    ${clusterCaptions}
    ${ticks}
    <line x1="${MARGIN}" y1="${BASELINE}" x2="${W - MARGIN}" y2="${BASELINE}" stroke="var(--border)" stroke-width="1.5"/>
    <text x="${MARGIN}" y="${edgeY}" font-size="12" font-weight="700" fill="var(--text)">${lo} MHz</text>
    <text x="${W - MARGIN}" y="${edgeY}" font-size="12" font-weight="700" fill="var(--text)" text-anchor="end">${hi} MHz</text>
  </svg>`;

  return `<div class="chan-grid" data-uid="${escapeHtml(uid)}" data-bw="${escapeHtml(bw)}" style="display:${active ? "block" : "none"}">${svgHtml}</div>`;
}

// Renders one band of a "channel_plan_display" family: a bandwidth selector
// (large chips) plus, per bandwidth, a full-band spectrum strip with a tick
// per channel. No vendor data, no extra columns — just the channel plan
// itself, sized for someone scanning it at a glance.
function renderChannelPlanBand(band, uid) {
  const planEntry = CHANNEL_PLANS[band.plan_key];
  const allPlans = planEntry ? planEntry.plans : [];
  const bwList = (band.bandwidths || []).filter(bw => allPlans.some(p => p.channel_bandwidth === bw));
  const [lo, hi] = planEntry ? channelPlanBandRange(band.plan_key) : [0, 0];

  const sections = bwList.map((bw, idx) =>
    renderChannelSpectrum(lo, hi, allPlans.find(p => p.channel_bandwidth === bw), uid, bw, idx === 0)
  ).join("");

  const chips = bwList.map((bw, idx) =>
    `<button class="chip-lg${idx === 0 ? " active" : ""}" data-chanplan="${escapeHtml(uid)}" data-bw="${escapeHtml(bw)}">${escapeHtml(bw)}</button>`
  ).join("");

  return `<details class="band" open>
    <summary>
      <span class="band-name">${escapeHtml(band.band)}</span>
      <span class="band-meta">Channel plan · ${bwList.length} bandwidth option${bwList.length === 1 ? "" : "s"}</span>
    </summary>
    <div class="band-note">${escapeHtml(MODEL_INFO.channel_plan_display.note)}</div>
    <div class="chan-section">
      <div class="chan-toolbar">${chips}</div>
      <p class="chan-unit-note">Full band span, to scale — each tick is one channel's low or high frequency; low and high pair by position (1st with 1st, 2nd with 2nd, …).</p>
      ${sections}
    </div>
  </details>`;
}

function renderBandTable(mfg, fam, band, uid) {
  if (band.model === "channel_plan_display") return renderChannelPlanBand(band, uid);
  const rows = band.rows || [];
  const info = band.model ? (MODEL_INFO[band.model] || null) : null;
  const note = info ? info.note : UNKNOWN_MODEL_NOTE;
  const label = info ? info.label : "Unknown";
  let body;

  if (!band.model) {
    body = `<p class="empty-note">No data yet — record type not determined for this band.</p>`;
  } else if (rows.length === 0) {
    body = `<p class="empty-note">No data found yet for this band.</p>`;
  } else if (band.model === "fixed_subband") {
    body = `<table>
      <thead><tr>
        <th>Sub-band</th><th>Side</th><th>Tx Min (MHz)</th><th>Tx Max (MHz)</th>
        <th>Rx Min (MHz)</th><th>Rx Max (MHz)</th><th>T/R Spacings</th>
        <th>Part Number</th><th>Paired PN</th><th>Source</th><th>Confidence</th>
        <th class="notes-cell">Notes</th>
      </tr></thead>
      <tbody>${rows.map(renderFixedRow).join("")}</tbody>
    </table>`;
  } else if (band.model === "tuning_range") {
    body = `<table>
      <thead><tr>
        <th>Band Min (MHz)</th><th>Band Max (MHz)</th><th>Max Tuning Range (MHz)</th>
        <th>T/R Spacings</th><th>Source</th><th>Confidence</th><th class="notes-cell">Notes</th>
      </tr></thead>
      <tbody>${rows.map(renderTuningRow).join("")}</tbody>
    </table>`;
  } else if (band.model === "full_band_tunable") {
    body = `<table>
      <thead><tr>
        <th>Band Min (MHz)</th><th>Band Max (MHz)</th><th>T/R Spacings</th>
        <th>Source</th><th>Confidence</th><th class="notes-cell">Notes</th>
      </tr></thead>
      <tbody>${rows.map(renderFullBandRow).join("")}</tbody>
    </table>`;
  } else {
    body = `<p class="empty-note">Unrecognized record type "${escapeHtml(band.model)}".</p>`;
  }

  const openAttr = rows.length > 0 ? " open" : "";
  const freqMap = rows.length > 0 ? renderFreqMap(band, uid) : "";
  return `<details class="band"${openAttr}>
    <summary>
      <span class="band-name">${escapeHtml(band.band)}</span>
      <span class="band-meta">${escapeHtml(label)} · T/R: ${escapeHtml(fmtSpacingsPlain(band.tr_spacings))} · ${rows.length} row${rows.length === 1 ? "" : "s"}</span>
    </summary>
    <div class="band-note">${escapeHtml(note)}</div>
    ${freqMap}
    <div class="table-scroll">${body}</div>
  </details>`;
}

function familyRowCount(fam) {
  return fam.bands.reduce((sum, b) => sum + (b.rows ? b.rows.length : 0), 0);
}

function renderFamilyPanel(mfg, fam) {
  const count = familyRowCount(fam);
  const verified = fam.last_verified ? escapeHtml(fam.last_verified) : "not recorded";
  return `
    <div class="family-header">
      <h2>${escapeHtml(mfg.name)} — ${escapeHtml(fam.name)}</h2>
      <div class="family-meta">${count} row${count === 1 ? "" : "s"} catalogued · Last verified: ${verified}</div>
      ${fam.description ? `<p class="family-desc">${escapeHtml(fam.description)}</p>` : ""}
    </div>
    ${fam.bands.map(b => renderBandTable(mfg, fam, b, `${fam.id}--${b.band}`.replace(/[^a-z0-9]+/gi, "-"))).join("")}
  `;
}

/* ---------------------------------------------------------------- SEARCH */

function parseFreqQuery(q) {
  if (q.trim() === "") return null;
  const n = Number(q);
  return isNaN(n) ? null : n;
}

function computeSearchResults(query) {
  const freq = parseFreqQuery(query);
  const ql = query.trim().toLowerCase();
  const results = [];
  CATALOG.manufacturers.forEach(mfg => {
    mfg.families.forEach(fam => {
      fam.bands.forEach(band => {
        (band.rows || []).forEach(row => {
          let match = false;
          if (freq !== null) {
            if (band.model === "fixed_subband") {
              if (row.tx_min != null && row.tx_max != null && freq >= row.tx_min && freq <= row.tx_max) match = true;
              if (!match && row.rx_min != null && row.rx_max != null && freq >= row.rx_min && freq <= row.rx_max) match = true;
            } else if (band.model === "tuning_range" || band.model === "full_band_tunable") {
              if (row.band_min != null && row.band_max != null && freq >= row.band_min && freq <= row.band_max) match = true;
            }
          } else {
            const hay = [row.part_number, row.pair_part_number, row.subband, mfg.name, fam.name]
              .filter(Boolean).join(" ").toLowerCase();
            if (hay.includes(ql)) match = true;
          }
          if (match) results.push({ mfg, fam, band, row });
        });
      });
    });
  });
  return results;
}

function renderSearchResults(query, results) {
  const rowsHtml = results.map(({ mfg, fam, band, row }) => {
    const isFixed = band.model === "fixed_subband";
    const rangeLabel = isFixed ? fmtVal(row.subband) : fmtVal(row.band_min != null || row.band_max != null ? `${row.band_min ?? "—"}–${row.band_max ?? "—"}` : null);
    return `<tr>
      <td>${escapeHtml(mfg.name)}</td>
      <td>${escapeHtml(fam.name)}</td>
      <td>${escapeHtml(band.band)}</td>
      <td>${escapeHtml(MODEL_INFO[band.model] ? MODEL_INFO[band.model].label : "Unknown")}</td>
      <td>${rangeLabel}</td>
      <td>${isFixed ? fmtVal(row.side) : '<span class="muted">—</span>'}</td>
      <td>${isFixed ? fmtVal(row.tx_min) : fmtVal(row.band_min)}</td>
      <td>${isFixed ? fmtVal(row.tx_max) : fmtVal(row.band_max)}</td>
      <td>${isFixed ? fmtVal(row.rx_min) : '<span class="muted">—</span>'}</td>
      <td>${isFixed ? fmtVal(row.rx_max) : '<span class="muted">—</span>'}</td>
      <td>${fmtVal(row.part_number)}</td>
      <td>${fmtSpacings(row.tr_spacings)}</td>
      <td>${confBadge(row.confidence)}</td>
      <td>${sourceIcon(row.source_url, row.source_type)}</td>
    </tr>`;
  }).join("");

  return `
    <div class="search-banner">
      <span>Search results for "<strong>${escapeHtml(query)}</strong>" — ${results.length} match${results.length === 1 ? "" : "es"}</span>
      <button class="btn" id="clearSearchBtn">Clear search</button>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr>
          <th>Manufacturer</th><th>Family</th><th>Band</th><th>Type</th>
          <th>Sub-band / Range</th><th>Side</th><th>Tx / Min (MHz)</th><th>Tx / Max (MHz)</th>
          <th>Rx Min (MHz)</th><th>Rx Max (MHz)</th><th>Part Number</th><th>T/R Spacings</th>
          <th>Confidence</th><th>Source</th>
        </tr></thead>
        <tbody>${rowsHtml || `<tr><td colspan="14" class="empty-note">No matches.</td></tr>`}</tbody>
      </table>
    </div>
  `;
}

/* ------------------------------------------------------------------ CSV */

function csvEscape(v) {
  if (v === null || v === undefined) return "";
  const s = Array.isArray(v) ? v.join(" / ") : String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

const CSV_COLUMNS = [
  "manufacturer", "family", "band", "model", "subband", "side",
  "tx_min", "tx_max", "rx_min", "rx_max", "band_min", "band_max", "max_tuning_range",
  "tr_spacings", "part_number", "pair_part_number", "source_url", "source_type", "confidence", "notes"
];

function flattenForCsv(mfg, fam, band, row) {
  return {
    manufacturer: mfg.name, family: fam.name, band: band.band, model: band.model,
    subband: row.subband ?? null, side: row.side ?? null,
    tx_min: row.tx_min ?? null, tx_max: row.tx_max ?? null,
    rx_min: row.rx_min ?? null, rx_max: row.rx_max ?? null,
    band_min: row.band_min ?? null, band_max: row.band_max ?? null,
    max_tuning_range: row.max_tuning_range ?? null,
    tr_spacings: row.tr_spacings || [], part_number: row.part_number ?? null,
    pair_part_number: row.pair_part_number ?? null, source_url: row.source_url ?? null,
    source_type: row.source_type ?? null, confidence: row.confidence ?? null, notes: row.notes || null
  };
}

function currentViewRecords() {
  if (state.query.trim() !== "") {
    return computeSearchResults(state.query).map(({ mfg, fam, band, row }) => flattenForCsv(mfg, fam, band, row));
  }
  const mfg = CATALOG.manufacturers.find(m => m.id === state.mfgId);
  const fam = mfg.families.find(f => f.id === state.familyId);
  const out = [];
  fam.bands.forEach(band => (band.rows || []).forEach(row => out.push(flattenForCsv(mfg, fam, band, row))));
  return out;
}

function downloadBlob(filename, mime, content) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportCsv() {
  const records = currentViewRecords();
  const lines = [CSV_COLUMNS.join(",")];
  records.forEach(rec => lines.push(CSV_COLUMNS.map(c => csvEscape(rec[c])).join(",")));
  downloadBlob("microwave-radio-catalog-view.csv", "text/csv", lines.join("\n"));
}

function exportJson() {
  downloadBlob("microwave-radio-catalog.json", "application/json", JSON.stringify(CATALOG, null, 2));
}

}

function renderFamilyTabs() {
  const el = document.getElementById("familyTabs");
  const mfg = CATALOG.manufacturers.find(m => m.id === state.mfgId);
  const groups = [];
  const seen = new Map();
  mfg.families.forEach(f => {
    const key = f.group || "__none__";
    if (!seen.has(key)) { seen.set(key, []); groups.push(key); }
    seen.get(key).push(f);
  });
  el.innerHTML = groups.map(key => {
    const fams = seen.get(key);
    const label = key === "__none__" ? "" : `<span class="family-group-label">${escapeHtml(key)}</span>`;
    const btns = fams.map(f =>
      `<button class="tab-btn${f.id === state.familyId ? " active" : ""}" data-fam="${f.id}">${escapeHtml(f.name)}</button>`
    ).join("");
    return `<span class="family-group">${label}${btns}</span>`;
  }).join("");
}

function renderMain() {
  const main = document.getElementById("main");
  if (state.query.trim() !== "") {
    main.innerHTML = renderSearchResults(state.query, computeSearchResults(state.query));
    const clearBtn = document.getElementById("clearSearchBtn");
    if (clearBtn) clearBtn.addEventListener("click", () => {
      state.query = "";
      document.getElementById("search").value = "";
      render();
    });
    return;
  }
  const mfg = CATALOG.manufacturers.find(m => m.id === state.mfgId);
  const fam = mfg.families.find(f => f.id === state.familyId);
  main.innerHTML = renderFamilyPanel(mfg, fam);
}

function render() {
  renderMfgTabs();
  renderFamilyTabs();
  renderMain();
}

document.getElementById("mfgTabs").addEventListener("click", e => {
  const btn = e.target.closest("[data-mfg]");
  if (!btn) return;
  state.mfgId = btn.dataset.mfg;
  state.familyId = CATALOG.manufacturers.find(m => m.id === state.mfgId).families[0].id;
  state.query = "";
  document.getElementById("search").value = "";
  render();
});

document.getElementById("familyTabs").addEventListener("click", e => {
  const btn = e.target.closest("[data-fam]");
  if (!btn) return;
  state.familyId = btn.dataset.fam;
  state.query = "";
  document.getElementById("search").value = "";
  render();
});

document.getElementById("search").addEventListener("input", e => {
  state.query = e.target.value;
  renderMain();
});

document.getElementById("exportCsvBtn").addEventListener("click", exportCsv);
document.getElementById("exportJsonBtn").addEventListener("click", exportJson);

document.getElementById("main").addEventListener("click", e => {
  const freqBtn = e.target.closest("[data-freqmap]");
  if (freqBtn) {
    const uid = freqBtn.dataset.freqmap, bw = freqBtn.dataset.bw;
    freqBtn.parentElement.querySelectorAll(`[data-freqmap="${uid}"]`).forEach(b => b.classList.toggle("active", b === freqBtn));
    const svg = freqBtn.closest(".freqmap").querySelector(`svg.freqmap-svg[data-uid="${uid}"]`);
    if (svg) svg.querySelectorAll(".chan-plan-lane").forEach(g => { g.style.display = (bw && g.dataset.bw === bw) ? "block" : "none"; });
    return;
  }
  const chanBtn = e.target.closest("[data-chanplan]");
  if (chanBtn) {
    const uid = chanBtn.dataset.chanplan, bw = chanBtn.dataset.bw;
    chanBtn.parentElement.querySelectorAll(`[data-chanplan="${uid}"]`).forEach(b => b.classList.toggle("active", b === chanBtn));
    const section = chanBtn.closest(".chan-section");
    section.querySelectorAll(`.chan-grid[data-uid="${uid}"]`).forEach(g => { g.style.display = (g.dataset.bw === bw) ? "block" : "none"; });
  }
});

render();
</script>
</body>
</html>
