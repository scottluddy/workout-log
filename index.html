<body>
<div id="root"></div>

<script>
  window.addEventListener('error', function (e) {
    var d = document.getElementById('__diag_err');
    if (!d) return;
    d.style.display = 'block';
    d.textContent = (d.textContent ? d.textContent + '\n' : '') + '[error] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
  });
  window.addEventListener('unhandledrejection', function (e) {
    var d = document.getElementById('__diag_err');
    if (!d) return;
    d.style.display = 'block';
    d.textContent = (d.textContent ? d.textContent + '\n' : '') + '[promise] ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
  });
  setTimeout(function () {
    var root = document.getElementById('root');
    if (root && !root.firstChild) {
      var d = document.getElementById('__diag_err');
      if (d) {
        d.style.display = 'block';
        d.textContent = (d.textContent ? d.textContent + '\n' : '') +
          '[diag] Nothing rendered after 6s. Likely a blocked script (React/Supabase/XLSX CDN) - check the Network tab for failed requests.';
      }
    }
  }, 6000);
</script>
<div id="__diag_err"></div>

<script>
"use strict";
const { useState, useEffect, useRef, useCallback } = React;
function ProgressBarRow({ current, target, unit, color }) {
    const safeTarget = target > 0 ? target : 1;
    const pct = Math.max(0, Math.min(100, Math.round((current / safeTarget) * 100)));
    const met = current >= target;
    const barColor = met ? "#2FAE66" : (color || "#D7263D");
    return (React.createElement("div", null,
        React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 } },
            React.createElement("div", { style: { fontSize: 20, fontWeight: 800, color: "#26221D" } },
                Math.round(current),
                " / ",
                Math.round(target),
                unit ? ` ${unit}` : ""),
            React.createElement("div", { style: { fontSize: 13, fontWeight: 700, color: barColor } },
                pct,
                "%")),
        React.createElement("div", { style: { height: 10, background: "#F1EDE6", borderRadius: 5, overflow: "hidden" } },
            React.createElement("div", { style: { height: "100%", width: `${pct}%`, background: barColor, borderRadius: 5 } }))));
}
function Input({ value, onChange, fs }) {
    return (React.createElement("input", { className: "wl-input", type: "text", inputMode: "decimal", placeholder: "", value: value || "", onChange: onChange, style: fs ? { ...BASE_INPUT_STYLE, fontSize: fs } : BASE_INPUT_STYLE }));
}
function App() {
    const [entries, setEntries] = useState({});

    const [swAccumulatedMs, setSwAccumulatedMs] = useState(0); // ms banked from previous run segments
    const [swTick, setSwTick] = useState(0); // dummy value bumped to force a re-render while running
    // ---- STOPWATCH state (end) ----

    const [mobilityDate, setMobilityDate] = useState(null); // dateKey being edited
    const [mobilityMonth, setMobilityMonth] = useState(null); // Date | null
    const mobilityDirtyRef = useRef(false);
    const [progView, setProgView] = useState(null); // null | "main"
    const [progMonth, setProgMonth] = useState(null); // Date | null
    const [progTab, setProgTab] = useState("month"); // "month" | "exercise"
    const [progBlockIdx, setProgBlockIdx] = useState(null); // null = follow the current block
    const [ptOpen, setPtOpen] = useState(false);
    const [ptExIdx, setPtExIdx] = useState(0);
    // ---- PERSONAL TRAINER state (end) ----
    // ---- BODY COMPOSITION state (start) ----
    const [bcEntries, setBcEntries] = useState({}); // dateKey -> {actualWeight,bf,waist,belly}
    const [bcBlocks, setBcBlocks] = useState([]); // [{id,type,startDate,endDate,startingWeight,weeklyRate}]
    const [bcView, setBcView] = useState(null); // null | "table" | "blocks"
    const [bcBlockForm, setBcBlockForm] = useState({ type: "bulk", startDate: "", endDate: "", startingWeight: "", weeklyRate: "" });
    const [bcBlockError, setBcBlockError] = useState("");
    // ---- BODY COMPOSITION state (end) ----
    // ---- ANALYSIS EXPORT state (start) ----
    const [axOpen, setAxOpen] = useState(false);
    const [axCopyStatus, setAxCopyStatus] = useState("");
    const [axProgramId, setAxProgramId] = useState(BUILTIN_ID); // which program the export pulls from; set to today's scheduled program when the screen opens
    // ---- ANALYSIS EXPORT state (end) ----
    // ---- AI WEEKLY TARGETS state (start) ----
    const [aiTargets, setAiTargets] = useState(null); // null | parsed weekly-targets object
    const [aiImportText, setAiImportText] = useState("");
    const [aiImportStatus, setAiImportStatus] = useState("");
    const [aiImportOk, setAiImportOk] = useState(true);
    const [aiDeckIndex, setAiDeckIndex] = useState(0);
    const aiDeckRef = useRef(null);
    // ---- AI WEEKLY TARGETS state (end) ----
    // ---- CARDIO state (start) ----
    const [cardioSessions, setCardioSessions] = useState([]); // [{id, date, startTime, endTime, durationSec}]
    const [cardioDeletedSessionIds, setCardioDeletedSessionIds] = useState([]); // tombstones — same fix as program deletion
    const [cardioUnlockedWeekKeys, setCardioUnlockedWeekKeys] = useState([]);
    const [cardioRevealedCount, setCardioRevealedCount] = useState(0);
    const [cardioView, setCardioView] = useState(null); // null | "main"

    const [cardioSwStartedAt, setCardioSwStartedAt] = useState(null);
    const [cardioSwAccumulatedMs, setCardioSwAccumulatedMs] = useState(0);
    const [cardioSwTick, setCardioSwTick] = useState(0);
    const cardioDirtyRef = useRef(false);
    // ---- CARDIO state (end) ----
    // ---- PROGRAM BLOCKS state (start) ----
    const [programBlocks, setProgramBlocks] = useState([]); // [{id, programId, startDate, endDate|null}]
    const [deletedProgramBlockIds, setDeletedProgramBlockIds] = useState([]); // tombstones
    const [pbView, setPbView] = useState(null); // null | "manage"
    const [pbSwitchProgramId, setPbSwitchProgramId] = useState(BUILTIN_ID);
    const [pbSwitchStartDate, setPbSwitchStartDate] = useState("");
    const [pbHistProgramId, setPbHistProgramId] = useState(BUILTIN_ID);
    const [pbHistStart, setPbHistStart] = useState("");
    const [pbHistEnd, setPbHistEnd] = useState("");
    const [pbError, setPbError] = useState("");
    const [pbHistoryProgramId, setPbHistoryProgramId] = useState(null); // which program's standalone history calendar is open, if any
    const [pbHistoryMonth, setPbHistoryMonth] = useState(null); // Date | null — month shown in that history calendar
    const programBlocksDirtyRef = useRef(false);
    // ---- PROGRAM BLOCKS state (end) ----
    const [currentProgramId, setCurrentProgramId] = useState(BUILTIN_ID);
    const [viewMonth, setViewMonth] = useState(startOfMonth(new Date()));
    const [focusedDate, setFocusedDate] = useState(null); // null | "YYYY-MM-DD"
    const [gapNotice, setGapNotice] = useState(null); // dateKey of a tapped date with no program scheduled
    const [vw, setVw] = useState(390);
    const [menuOpen, setMenuOpen] = useState(false);
    const [accountSubView, setAccountSubView] = useState(null); // null | "programs" | "sync" | "backup" | "modules"
    // null means "never chosen" — moduleOn() treats that as all-on so the app
    // looks complete until the user actually opts out of something.
    const [enabledModules, setEnabledModules] = useState(null);
    const enabledModulesDirtyRef = useRef(false);
    const [restoreText, setRestoreText] = useState("");
    const [status, setStatus] = useState("");
    const [statusOk, setStatusOk] = useState(true);
    const [programStatus, setProgramStatus] = useState("");
    const [programStatusOk, setProgramStatusOk] = useState(true);
    // ---- MANUAL PROGRAM BUILDER state (start) ----
    const [builderOpen, setBuilderOpen] = useState(false);
    const [builderStep, setBuilderStep] = useState(1); // 1 = choose kind + name, 2 = build content
    const [builderKind, setBuilderKind] = useState(null); // "weekly" | "custom"
    const [builderName, setBuilderName] = useState("");
    const [builderEditingId, setBuilderEditingId] = useState(null); // null = adding new; else editing this program's id
    const [builderEditingCreatedAt, setBuilderEditingCreatedAt] = useState(null);
    const [builderDays, setBuilderDays] = useState([]); // [{dow, exercises:[{name,sets,repRange}]}]
    const [builderDayTypes, setBuilderDayTypes] = useState([]); // [{label, exercises:[...]}]
    const [builderError, setBuilderError] = useState("");
    // ---- MANUAL PROGRAM BUILDER state (end) ----
    const [user, setUser] = useState(null);
    const [authEmail, setAuthEmail] = useState("");
    const [authPass, setAuthPass] = useState("");
    const [syncStatus, setSyncStatus] = useState("");
    const [syncOk, setSyncOk] = useState(true);
    const wrapRef = useRef(null);
    const saveTimer = useRef(null);
    const pushTimer = useRef(null);
    const supaRef = useRef(null);
    const uidRef = useRef(null);
    const pullingRef = useRef(false);
    const skipFirstSave = useRef(true);
    const dirtyRef = useRef(new Set());
    const programsDirtyRef = useRef(false);
    const stateRef = useRef({ entries, programs, currentProgramId });
    stateRef.current = { entries, programs, currentProgramId, deletedProgramIds, aiTargets, cardioSessions, cardioDeletedSessionIds, cardioUnlockedWeekKeys, cardioRevealedCount, programBlocks, deletedProgramBlockIds, enabledModules, mobilityLog, mobilityModalities };
    const migratedRef = useRef(false);
    // ---- BODY COMPOSITION refs (start) ----
    const bcStateRef = useRef({ entries: {}, blocks: [] });
    bcStateRef.current = { entries: bcEntries, blocks: bcBlocks };
    const bcDirtyEntriesRef = useRef(new Set()); // date keys with unsynced local edits
    const bcBlocksDirtyRef = useRef(false); // true while a local block add/remove hasn't been confirmed pushed
    const aiTargetsDirtyRef = useRef(false); // true while a local import/clear hasn't been confirmed pushed
    const bcPendingDeleteIdsRef = useRef(new Set()); // block ids removed locally, pending a soft-delete push
    const bcPushTimerRef = useRef(null);
    const bcSkipFirstSaveRef = useRef(true);
    const bcTableScrollRef = useRef(null);
    // ---- BODY COMPOSITION refs (end) ----
    // Load local data, then run the one-time (additive, idempotent) migration
    useEffect(() => {
        try {
            const raw = localStorage.getItem(LOCAL_KEY);
            if (raw) {
                const d = JSON.parse(raw);
                if (d.entries)
                    setEntries(d.entries);
                if (Array.isArray(d.programs))
                    setPrograms(d.programs);
                if (d.currentProgramId !== undefined)
                    setCurrentProgramId(d.currentProgramId);
                if (Array.isArray(d.deletedProgramIds))
                    setDeletedProgramIds(d.deletedProgramIds);
                if (d.aiTargets) {
                    const check = validateWeeklyTargets(d.aiTargets);
                    if (check.ok)
                        setAiTargets(check.data);
                }
                if (Array.isArray(d.cardioSessions))
                    setCardioSessions(d.cardioSessions);
                if (Array.isArray(d.cardioDeletedSessionIds))
                    setCardioDeletedSessionIds(d.cardioDeletedSessionIds);
                if (Array.isArray(d.cardioUnlockedWeekKeys))
                    setCardioUnlockedWeekKeys(d.cardioUnlockedWeekKeys);
                if (typeof d.cardioRevealedCount === "number")
                    setCardioRevealedCount(d.cardioRevealedCount);
                if (Array.isArray(d.programBlocks))
                    setProgramBlocks(d.programBlocks);
                if (Array.isArray(d.deletedProgramBlockIds))
                    setDeletedProgramBlockIds(d.deletedProgramBlockIds);
                if (Array.isArray(d.enabledModules))
                    setEnabledModules(d.enabledModules);
                if (d.mobilityLog && typeof d.mobilityLog === "object")
                    setMobilityLog(d.mobilityLog);
                if (Array.isArray(d.mobilityModalities))
                    setMobilityModalities(d.mobilityModalities);
            }
        }
        catch (e) { }
    }, []);
    // ---- BODY COMPOSITION local load/save (start) ----

        try {
            const raw = localStorage.getItem("bc_v1");
            if (raw) {
                const d = JSON.parse(raw);
                if (d.entries)
                    setBcEntries(d.entries);
                if (Array.isArray(d.blocks))
                    setBcBlocks(d.blocks);
            }
        }
        catch (e) { }
    }, []);
    useEffect(() => {
        if (bcSkipFirstSaveRef.current) {

        try {
            localStorage.setItem("bc_v1", JSON.stringify({ entries: bcEntries, blocks: bcBlocks }));
        }
        catch (e) { }
        if (uidRef.current) {
            clearTimeout(bcPushTimerRef.current);
            bcPushTimerRef.current = setTimeout(() => { bcPushEntries(); bcPushBlocks(); }, 1200);
        }
    }, [bcEntries, bcBlocks]);
    // ---- BODY COMPOSITION local load/save (end) ----
    // (AI Weekly Targets persistence now flows through the main sync cycle
    // below, alongside entries/programs — see stateRef.current and the
    // pullMerge/pushRemote handling further down.)
    useEffect(() => {
        const t = setTimeout(() => {
            if (migratedRef.current)
                return;
            migratedRef.current = true;
            setEntries((cur) => {
                const { next, migrated } = migrateLegacyEntries(cur);
                if (migrated > 0) {
                    dirtyRef.current = new Set(Object.keys(next));
                    return next;
                }
                return cur;
            });
        }, 1200);
        return () => clearTimeout(t);
    }, []);
    // ---- PROGRAM 0 MIGRATION (start) — additive, idempotent, and scoped
    // strictly to accounts that already used the old hardcoded Split 4.0.
    //
    // Split 4.0 used to exist only in code, with id 0 baked into every entry
    // key logged before multi-program support. Rather than rewrite those keys
    // (which would put years of history at risk), this promotes it in place:
    // the same id 0 becomes an ordinary row in the programs list. No entry is
    // touched, copied, or rekeyed — the id never changes, so every existing
    // key keeps resolving exactly as before.
    //
    // Guards, in order: runs once per mount; skips if program 0 already
    // exists; skips if the user deleted it (tombstone); and skips entirely
    // if there is no data under program 0 — which is what makes new users
    // start with a genuinely empty programs list.

    // ---- PROGRAM 0 MIGRATION (end) ----
    // ---- PROGRAM BLOCKS: one-time migration (start) — additive only. If
    // no blocks exist yet, creates a single open-ended block for whatever
    // program was already active, starting from the earliest date it has
    // any logged data (so existing history stays covered by the Master
    // Calendar rather than suddenly showing as ungoverned gaps). ----
    const pbMigratedRef = useRef(false);

        const t = setTimeout(() => {
            if (pbMigratedRef.current)

                        return;

                });

    const persistLocal = useCallback(() => {

    const bcPushEntries = useCallback(async () => {

        catch (e) { }

        const supa = supaRef.current, uid = uidRef.current;

            return;

            const [entriesRes, blocksRes] = await Promise.all([
                supa.from("body_comp_entries").select("*").eq("user_id", uid),
                supa.from("body_comp_blocks").select("*").eq("user_id", uid).eq("deleted", false),

                setBcEntries((cur) => {
                    const merged = {};
                    entriesRes.data.forEach((row) => {
                        merged[row.date] = { actualWeight: row.actual_weight || "", bf: row.bf || "", waist: row.waist || "", belly: row.belly || "" };
                    });
                    Object.keys(cur).forEach((dk) => { if (bcDirtyEntriesRef.current.has(dk))

                    return merged;
                });
            }
            if (!blocksRes.error && blocksRes.data && !bcBlocksDirtyRef.current) {
                setBcBlocks(blocksRes.data.map((row) => ({ id: row.id, type: row.type, startDate: row.start_date, endDate: row.end_date, startingWeight: row.starting_weight || "", weeklyRate: row.weekly_rate || "" })));
            }
        }
        catch (e) { }
    }, []);
    // ---- BODY COMPOSITION sync (end) ----
    const pushRemote = useCallback(async () => {
        const supa = supaRef.current, uid = uidRef.current;
        if (!supa || !uid)
            return;
        const pushedKeys = new Set(dirtyRef.current);
        const wasProgramsDirty = programsDirtyRef.current;
        const wasAiTargetsDirty = aiTargetsDirtyRef.current;
